name: Build, Test and Validate (CI)

on:
  push:
    branches:
      - 'features/**'
      - 'fixes/**'
    paths:
      - 'src/**'
      - 'tests/**'
      - 'docs/**'
      - 'build.ps1'
      - 'platyps.ps1'
      - '.github/workflows/ci.yaml'
      - '.github/workflows/cd.yaml'
  pull_request:
    branches:
      - main
    paths:
      - 'src/**'
      - 'tests/**'
      - 'docs/**'
      - 'build.ps1'
      - 'platyps.ps1'
      - '.github/workflows/ci.yaml'
      - '.github/workflows/cd.yaml'
  workflow_dispatch:

env:
  MODULE_NAME: MSCKite.Azure.Platform
  CONFIGURATION: Debug

jobs:
  build-test:
    runs-on: windows-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install PowerShell dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Install-Module -Name Az.Accounts, Az.Resources -Force -AllowClobber -Scope CurrentUser -Repository PSGallery
          Install-Module -Name Pester -MinimumVersion 5.5.0 -Force -SkipPublisherCheck -Scope CurrentUser -Repository PSGallery
          Install-Module -Name Microsoft.PowerShell.PlatyPS -Force -AllowClobber -Scope CurrentUser -Repository PSGallery

      - name: Build module
        shell: pwsh
        run: |
          dotnet publish "src/$env:MODULE_NAME.csproj" `
            --configuration $env:CONFIGURATION `
            --output "src/bin/$env:CONFIGURATION/netstandard2.0/$env:MODULE_NAME"

      - name: Test Markdown help
        shell: pwsh
        run: ./platyps.ps1 -Mode Test

      - name: Run Pester tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $modulePath = "src/bin/$env:CONFIGURATION/netstandard2.0/$env:MODULE_NAME/$env:MODULE_NAME.psd1"
          if (-not (Test-Path $modulePath)) {
              Write-Error "No module manifest (.psd1) found at '$modulePath'"
              exit 1
          }

          New-Item -Path ./TestResults -ItemType Directory -Force | Out-Null
          $env:MODULE_UNDER_TEST = Convert-Path $modulePath

          $configuration = New-PesterConfiguration
          $configuration.Run.Path = './tests'
          $configuration.Run.Exit = $true
          $configuration.TestResult.Enabled = $true
          $configuration.TestResult.OutputPath = './TestResults/pester-test-results.xml'
          $configuration.TestResult.OutputFormat = 'NUnitXml'

          Invoke-Pester -Configuration $configuration

      - name: Upload Pester test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pester-test-results
          path: TestResults/pester-test-results.xml
          if-no-files-found: ignore
