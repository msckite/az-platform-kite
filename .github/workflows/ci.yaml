name: Build, Test and Validate (CI)

on:
  pull_request:
    branches:
      - main
    paths:
      - 'src/**'
      - 'tests/**'
      - 'docs/**'
      - 'build.ps1'
      - 'platyps.ps1'
      - '.github/workflows/ci.yaml'
      - '.github/workflows/cd.yaml'
  workflow_call:
    inputs:
      configuration:
        description: Build configuration
        required: false
        type: string
        default: Debug
      tag_name:
        description: Release tag used to stamp the module manifest
        required: false
        type: string
        default: ''
      upload_artifact:
        description: Upload the tested module for a calling workflow
        required: false
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      configuration:
        description: Build configuration
        required: false
        type: choice
        options:
          - Debug
          - Release
        default: Debug
      tag_name:
        description: Optional release tag used to stamp the module manifest
        required: false
        type: string
        default: ''
      upload_artifact:
        description: Upload the tested module
        required: false
        type: boolean
        default: false

env:
  MODULE_NAME: MSCKite.Azure.Platform
  CONFIGURATION: ${{ inputs.configuration || 'Debug' }}
  TAG_NAME: ${{ inputs.tag_name || '' }}

jobs:
  build-test:
    runs-on: windows-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      - name: Install PowerShell dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Install-Module -Name Az.Accounts, Az.Resources -Force -AllowClobber -Scope CurrentUser -Repository PSGallery
          Install-Module -Name Pester -MinimumVersion 5.5.0 -Force -SkipPublisherCheck -Scope CurrentUser -Repository PSGallery
          Install-Module -Name Microsoft.PowerShell.PlatyPS -Force -AllowClobber -Scope CurrentUser -Repository PSGallery
          Install-Module -Name psake -Force -SkipPublisherCheck -Scope CurrentUser -Repository PSGallery

      - name: Update module manifest
        if: env.TAG_NAME != ''
        shell: pwsh
        run: Invoke-PSake ./build.ps1 -TaskList UpdateManifest

      - name: Build module
        shell: pwsh
        run: |
          dotnet publish "src/$env:MODULE_NAME.csproj" `
            --configuration $env:CONFIGURATION `
            --output "src/bin/$env:CONFIGURATION/netstandard2.0/$env:MODULE_NAME"

      - name: Test Markdown help
        shell: pwsh
        run: ./platyps.ps1 -Mode Test

      - name: Run Pester tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $modulePath = "src/bin/$env:CONFIGURATION/netstandard2.0/$env:MODULE_NAME/$env:MODULE_NAME.psd1"
          if (-not (Test-Path $modulePath)) {
              Write-Error "No module manifest (.psd1) found at '$modulePath'"
              exit 1
          }

          New-Item -Path ./TestResults -ItemType Directory -Force | Out-Null
          $env:MODULE_UNDER_TEST = Convert-Path $modulePath

          $configuration = New-PesterConfiguration
          $configuration.Run.Path = './tests'
          $configuration.Run.Exit = $true
          $configuration.TestResult.Enabled = $true
          $configuration.TestResult.OutputPath = './TestResults/pester-test-results.xml'
          $configuration.TestResult.OutputFormat = 'NUnitXml'

          Invoke-Pester -Configuration $configuration

      - name: Verify module version
        if: env.TAG_NAME != ''
        shell: pwsh
        run: |
          $tag = $env:TAG_NAME.TrimStart('v')
          $manifestPath = "src/bin/$env:CONFIGURATION/netstandard2.0/$env:MODULE_NAME/$env:MODULE_NAME.psd1"
          $manifest = Test-ModuleManifest -Path $manifestPath
          $fullModuleVersion = $manifest.Version.ToString()

          if ($manifest.PrivateData.PSData.Prerelease) {
              $fullModuleVersion = "$fullModuleVersion-$($manifest.PrivateData.PSData.Prerelease)"
          }

          if ($fullModuleVersion -ne $tag) {
              Write-Error "Module version '$fullModuleVersion' does not match release tag '$tag'"
              exit 1
          }

      - name: Upload tested module
        if: inputs.upload_artifact
        uses: actions/upload-artifact@v6
        with:
          name: powershell-module
          path: src/bin/${{ env.CONFIGURATION }}/netstandard2.0/${{ env.MODULE_NAME }}
          if-no-files-found: error

      - name: Upload Pester test results
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: pester-test-results
          path: TestResults/pester-test-results.xml
          if-no-files-found: ignore
