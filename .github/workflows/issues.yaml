name: Sync Issue Status Labels

on:
  pull_request_target:
    types:
      - opened
      - closed

  create:

  issues:
    types:
      - opened
      - reopened

permissions:
  contents: read
  issues: write
  pull-requests: read

jobs:
  pr-label-sync:
    if: github.event_name == 'pull_request_target'
    runs-on: ubuntu-latest

    steps:
      - name: Update linked issue labels
        uses: actions/github-script@v7
        with:
          script: |
            const linkedIssues = await github.graphql(
              `query($owner: String!, $repo: String!, $number: Int!) {
                repository(owner: $owner, name: $repo) {
                  pullRequest(number: $number) {
                    closingIssuesReferences(first: 100) {
                      nodes {
                        number
                        repository {
                          nameWithOwner
                        }
                      }
                    }
                  }
                }
              }`,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                number: context.payload.pull_request.number
              }
            );

            const issueNumbers = [
              ...new Set(
                linkedIssues.repository.pullRequest.closingIssuesReferences.nodes
                  .filter(issue => issue.repository.nameWithOwner === `${context.repo.owner}/${context.repo.repo}`)
                  .map(issue => issue.number)
              )
            ];

            if (issueNumbers.length === 0) {
              core.info('No linked issues found.');
              return;
            }

            for (const issueNumber of issueNumbers) {

              if (context.payload.action === 'opened') {
                core.info(`Updating issue #${issueNumber} -> In Progress`);

                try {
                  await github.rest.issues.removeLabel({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number: issueNumber,
                    name: 'todo :construction_worker:'
                  });
                } catch {}

                await github.rest.issues.addLabels({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issueNumber,
                  labels: ['in progress :dart:']
                });
              }

              if (
                context.payload.action === 'closed' &&
                context.payload.pull_request.merged === true
              ) {
                core.info(`Updating issue #${issueNumber} -> Completed`);

                try {
                  await github.rest.issues.removeLabel({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number: issueNumber,
                    name: 'in progress :dart:'
                  });
                } catch {}

                await github.rest.issues.addLabels({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issueNumber,
                  labels: ['completed :white_check_mark:']
                });
              }

              if (
                context.payload.action === 'closed' &&
                context.payload.pull_request.merged === false
              ) {
                core.info(
                  `PR closed without merge. No label changes for issue #${issueNumber}`
                );
              }
            }

  branch-label-sync:
    if: github.event_name == 'create' && github.event.ref_type == 'branch'
    runs-on: ubuntu-latest

    steps:
      - name: Mark branch issue as in progress
        uses: actions/github-script@v7
        with:
          script: |
            const branchName = context.payload.ref;
            const issueMatch = branchName.match(
              /(?:^|[\/_-])#?(\d+)(?=$|[\/_-])/i
            );

            if (!issueMatch) {
              core.info(`No issue number found in branch '${branchName}'.`);
              return;
            }

            const issueNumber = Number(issueMatch[1]);
            core.info(`Updating issue #${issueNumber} -> In Progress`);

            for (const label of [
              'todo :construction_worker:',
              'completed :white_check_mark:'
            ]) {
              try {
                await github.rest.issues.removeLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issueNumber,
                  name: label
                });
              } catch {}
            }

            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              labels: ['in progress :dart:']
            });

  issue-status-sync:
    if: github.event_name == 'issues'
    runs-on: ubuntu-latest

    steps:
      - name: Set issue status label
        uses: actions/github-script@v7
        with:
          script: |
            const issueNumber = context.payload.issue.number;

            if (context.payload.action === 'opened') {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                labels: ['todo :construction_worker:']
              });

              core.info(`Issue #${issueNumber} opened: todo`);
              return;
            }

            try {
              await github.rest.issues.removeLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                name: 'completed :white_check_mark:'
              });
            } catch {}

            try {
              await github.rest.issues.removeLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                name: 'in progress :dart:'
              });
            } catch {}

            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              labels: ['todo :construction_worker:']
            });

            core.info(
              `Issue #${issueNumber} reopened: completed -> todo`
            );
