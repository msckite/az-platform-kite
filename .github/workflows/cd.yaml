name: Publish to PowerShell Gallery (CD)

on:
  release:
    types: [published]

env:
  MODULE_NAME: MSCKite.Azure.Platform

jobs:
  build-test:
    uses: ./.github/workflows/ci.yaml
    with:
      configuration: Release
      tag_name: ${{ github.event.release.tag_name }}
      upload_artifact: true
    permissions:
      contents: read

  publish:
    needs: build-test
    runs-on: windows-latest

    permissions:
      contents: read

    steps:
      - name: Download tested module
        uses: actions/download-artifact@v7
        with:
          name: powershell-module
          path: ${{ env.MODULE_NAME }}

      - name: Install module dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Install-Module -Name Az.Accounts, Az.Resources, Az.ManagedServiceIdentity -Force -AllowClobber -Scope CurrentUser -Repository PSGallery

      - name: Publish module
        shell: pwsh
        env:
          NUGET_API_KEY: ${{ secrets.PSGALLERY_API_KEY }}
        run: |
          $ErrorActionPreference = 'Stop'

          $modulePath = Join-Path $PWD $env:MODULE_NAME
          $manifestPath = Join-Path $modulePath "$env:MODULE_NAME.psd1"
          Test-ModuleManifest -Path $manifestPath -ErrorAction Stop | Out-Null
          Publish-Module -Path $modulePath -Repository PSGallery -NuGetApiKey $env:NUGET_API_KEY
