name: platform-ci

on:
  pull_request:
    branches:
      - main
    paths:
      - 'config/global-config.jsonc'
      - 'config/platform-config.jsonc'
      - '.github/workflows/platform-*.yml'
      - '.github/actions/setup-platform-kite/**'
  workflow_dispatch:

concurrency:
  # Ensure only one CI workflow runs per branch at a time
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Validate IaC
    uses: ./.github/workflows/platform-validate.yml
    permissions:
      contents: read

  plan:
    name: Preflight IaC platform configuration
    needs: [validate]
    uses: ./.github/workflows/platform-provision.yml
    permissions:
      contents: read
      id-token: write
    with:
      # Reuse the protected project environment as the approval and OIDC gate. The WhatIf run
      # evaluates the complete platform configuration and does not deploy changes.
      environment: prd
      what-if: true
    secrets: inherit
