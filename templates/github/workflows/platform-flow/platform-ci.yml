name: 'Platform CI'

on:
  pull_request:
    branches:
      - main
    paths:
      - 'config/global-config.jsonc'
      - 'config/platform-config.jsonc'
      - '.github/workflows/platform-*.yml'
      - '.github/actions/setup-platform-kite/**'
  workflow_dispatch:

concurrency:
  # Ensure only one CI workflow runs per branch at a time
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Validate IaC
    uses: ./.github/workflows/platform-validate.yml
    permissions:
      contents: read

  plan:
    name: Preflight IaC platform configuration
    needs: [validate]
    uses: ./.github/workflows/platform-provision.yml
    permissions:
      contents: read
      id-token: write
    with:
      # Read-only twin of the 'platform' environment: its identity holds subscription-level Reader,
      # so it can preview every environment's resource group, but cannot change anything. The
      # 'platform' environment itself only accepts runs from main, so a pull request can never
      # sign in with its Contributor/User Access Administrator identity.
      environment: platform-plan
      what-if: true
    secrets: inherit
