name: 'Platform CD'

on:
  push:
    branches:
      - main
    paths:
      - 'config/global-config.jsonc'
      - 'config/platform-config.jsonc'
      - '.github/workflows/platform-*.yml'
      - '.github/actions/setup-platform-kite/**'
  # Manual rerun from main only; other branches are skipped by the job conditions below
  workflow_dispatch:

concurrency:
  # Queue deployments instead of cancelling one that is already applying changes
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Reconcile IaC platform configuration
    uses: ./.github/workflows/platform-provision.yml
    # Never reconcile from a feature branch, also not through a manual run
    if: |
      github.ref == 'refs/heads/main'
    permissions:
      contents: read
      id-token: write
    with:
      # Dedicated bootstrap environment for the platform pipeline itself: its identity has
      # subscription-level RBAC, so it can see and reconcile every environment's resource group,
      # not just one. The reusable workflow reconciles the complete platform configuration in one
      # execution.
      environment: platform
      what-if: false
    secrets: inherit
