name: platform-cd

# GitHub Flow (branchStrategy: "github").
#
# CD runs when a pull request is merged into main (a push to main). It revalidates the
# configuration, applies every provisioning phase to dev, and only promotes to prd once the dev
# stage has completed successfully.
#
# Protect the prd GitHub environment with required reviewers so the promotion pauses for a manual
# approval, and require the platform-ci workflow as a status check on main so only branches with a
# green CI run can reach this workflow.

on:
  push:
    branches:
      - main
    paths:
      - 'config/**'
      - '.github/workflows/platform-*.yml'
      - '.github/actions/setup-platform-kite/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: platform-cd
  cancel-in-progress: false

jobs:
  validate:
    name: Validate
    uses: ./.github/workflows/platform-validate.yml
    permissions:
      contents: read
    with:
      global-config-path: config/global-config.jsonc
      platform-config-path: config/platform-config.jsonc

  deploy-dev:
    name: Deploy (dev)
    needs: validate
    uses: ./.github/workflows/platform-provision.yml
    permissions:
      contents: read
      id-token: write
    with:
      environment: dev
    secrets: inherit

  deploy-prd:
    name: Deploy (prd)
    needs: deploy-dev
    uses: ./.github/workflows/platform-provision.yml
    permissions:
      contents: read
      id-token: write
    with:
      environment: prd
    secrets: inherit
