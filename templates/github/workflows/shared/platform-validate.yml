name: 'Jobs: Platform Validate'

# Reusable job: verifies that config/global-config.jsonc and config/platform-config.jsonc are
# compatible with the schemas they declare, and reports whether a newer template is published.
# Runs without any Azure or GitHub credentials, so it is safe to run on pull requests from forks.

on:
  workflow_call:
    inputs:
      global-config-path:
        description: Path to global-config.jsonc.
        type: string
        required: false
        default: config/global-config.jsonc
      platform-config-path:
        description: Path to platform-config.jsonc.
        type: string
        required: false
        default: config/platform-config.jsonc
      template-branch:
        description: Branch or tag of the az-platform-kite repository whose schemas the configuration must match. Defaults to the release tag of the pinned module version ('kiteVersion').
        type: string
        required: false
        default: ''
      module-version:
        description: Exact version of MSCKite.Azure.Platform to install. Overrides 'kiteVersion' in global-config.jsonc; leave empty to use that pinned version.
        type: string
        required: false
        default: ''
      allow-prerelease:
        description: Allow a prerelease version when no version is pinned. A pinned prerelease version is always allowed.
        type: boolean
        required: false
        default: false
      fail-on-update-available:
        description: Fail the job when a newer template version is published upstream.
        type: boolean
        required: false
        default: false

permissions:
  contents: read

jobs:
  validate:
    name: Validate configuration
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Platform Kite
        uses: ./.github/actions/setup-platform-kite
        with:
          module-version: ${{ inputs.module-version }}
          global-config-path: ${{ inputs.global-config-path }}
          allow-prerelease: ${{ inputs.allow-prerelease }}
          azure-login: 'false'

      # Compatibility is checked against the schemas of the pinned release, not main, so a Kite change that is
      # merged but not yet released (or adopted through kiteVersion) never breaks this check
      - name: Download schemas of the pinned release
        id: pinned
        shell: pwsh
        env:
          TEMPLATE_BRANCH: ${{ inputs.template-branch }}
        run: |
          $ErrorActionPreference = 'Stop'
          $parameters = @{ IncludedFolders = 'schemas'; OutputFolder = '.tmp/pinned'; Force = $true }
          if (-not [string]::IsNullOrWhiteSpace($env:TEMPLATE_BRANCH)) { $parameters.Branch = $env:TEMPLATE_BRANCH }
          $download = Get-PlatformTemplate @parameters
          "ref=$($download.Branch)" >> $env:GITHUB_OUTPUT

      - name: Download templates of the latest release
        id: latest
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $download = Get-PlatformTemplate -IncludedFolders 'templates' -OutputFolder '.tmp/latest' -Branch latest -Force
          "ref=$($download.Branch)" >> $env:GITHUB_OUTPUT

      - name: Validate template and schema versions
        shell: pwsh
        env:
          GLOBAL_CONFIG_PATH: ${{ inputs.global-config-path }}
          PLATFORM_CONFIG_PATH: ${{ inputs.platform-config-path }}
          FAIL_ON_UPDATE: ${{ inputs.fail-on-update-available }}
          PINNED_REF: ${{ steps.pinned.outputs.ref }}
          LATEST_REF: ${{ steps.latest.outputs.ref }}
        run: |
          $ErrorActionPreference = 'Stop'
          Write-Host "Validating against schemas of '$env:PINNED_REF'; checking for updates against release '$env:LATEST_REF'."

          $pairs = @(
            @{
              Template = $env:GLOBAL_CONFIG_PATH
              Schema   = '.tmp/pinned/schemas/global-config.schema.json'
              Latest   = '.tmp/latest/templates/global-config.jsonc'
            }
            @{
              Template = $env:PLATFORM_CONFIG_PATH
              Schema   = '.tmp/pinned/schemas/platform-config.schema.json'
              Latest   = '.tmp/latest/templates/platform-config.jsonc'
            }
          )

          $results = foreach ($pair in $pairs) {
            Test-PlatformTemplate -TemplatePath $pair.Template -SchemaPath $pair.Schema -LatestTemplatePath $pair.Latest
          }

          $results | Format-List | Out-String | Write-Host

          $summary = $results | Select-Object -Property TemplatePath, TemplateVersion, SchemaVersion, LatestTemplateVersion, IsCompatible, IsUpdateAvailable
          "## Platform configuration validation`n" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          ($summary | ConvertTo-Html -As Table -Fragment) | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append

          $incompatible = $results | Where-Object { -not $_.IsCompatible }
          if ($incompatible) {
            foreach ($result in $incompatible) {
              Write-Host "::error file=$($result.TemplatePath)::$($result.CompatibilityMessage)"
            }
            throw 'One or more configuration files are incompatible with their schema.'
          }

          $outdated = $results | Where-Object { $_.IsUpdateAvailable }
          foreach ($result in $outdated) {
            Write-Host "::warning file=$($result.TemplatePath)::A newer template version ($($result.LatestTemplateVersion)) is available in Kite release '$env:LATEST_REF'. Raise 'kiteVersion' to adopt it."
          }

          if ($outdated -and $env:FAIL_ON_UPDATE -eq 'true') {
            throw 'A newer template version is available and fail-on-update-available is enabled.'
          }
