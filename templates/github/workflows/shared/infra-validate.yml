        uses: actions/checkout@v7

      - name: Set up Platform Kite
        uses: ./.github/actions/setup-platform-kite
        with:
          azure-login: 'false'

      - name: Lint Bicep templates
        shell: pwsh
        run: |
          Write-Output '➡️ TODO: Lint the infra/ Bicep templates (e.g. az bicep lint, PSRule for Bicep)'

      - name: Build Bicep templates
        shell: pwsh
        run: |
          Write-Output '➡️ TODO: Build the infra/ Bicep templates (e.g. az bicep build) to catch syntax errors'
