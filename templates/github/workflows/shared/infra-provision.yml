name: 'Jobs: Infra Provision'

on:
  workflow_call:
    inputs:
      environment:
        description: GitHub environment used as the approval and OIDC gate.
        type: string
        required: false
        default: dev-infra
      what-if:
        description: Plan the infra deployment stack without applying changes.
        type: boolean
        required: false
        default: true
      deploy-script:
        description: Path to the deployment script that wraps the Azure Deployment Stack cmdlets.
        type: string
        required: false
        default: iac/res/sample/deploy.ps1

permissions:
  contents: read
  id-token: write

env:
  WHAT_IF: ${{ inputs.what-if }}

jobs:
  provision:
    name: Provision
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    timeout-minutes: 30

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name || github.sha }}

      - name: Set up Platform Kite
        uses: ./.github/actions/setup-platform-kite
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Provision Deployment Stack
        shell: pwsh
        env:
          ENV_CODE: ${{ vars.ENV_CODE }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          RESOURCE_GROUP_NAME: ${{ vars.RESOURCE_GROUP_NAME }}
          DEPLOYMENT_STACK_NAME: ${{ vars.DEPLOYMENT_STACK_NAME }}
        run: |
          $whatIf = $env:WHAT_IF -eq 'true'

          & '${{ inputs.deploy-script }}' -WhatIf:$whatIf -Verbose
