name: 'Jobs: Workload Provision'

# Deploys (or previews) the workload package built by workload-validate.yml; this job never builds. By default the
# package comes from the current run; a Release Flow production deployment passes the run id of the staging
# deployment instead, so production runs exactly the package staging ran.

on:
  workflow_call:
    inputs:
      environment:
        description: GitHub environment used as the approval and OIDC gate.
        type: string
        required: false
        default: dev
      what-if:
        description: Plan the workload deployment without applying changes.
        type: boolean
        required: false
        default: true
      ref:
        description: Git ref (tag or commit) to deploy. Defaults to the published release tag, or the triggering commit.
        type: string
        required: false
        default: ''
      artifact-name:
        description: Name of the run artifact holding the built workload package.
        type: string
        required: false
        default: workload-package
      artifact-run-id:
        description: Id of the workflow run that built the package. Defaults to the current run.
        type: string
        required: false
        default: ''

permissions:
  contents: read
  id-token: write
  actions: read

env:
  WHAT_IF: ${{ inputs.what-if }}

jobs:
  provision:
    name: Provision
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    timeout-minutes: 30

    permissions:
      contents: read
      id-token: write
      actions: read # download the package, also from another run

    steps:
      # The runner context is only available inside steps; later steps and actions read it as env.PACKAGE_PATH
      - name: Set package path
        shell: pwsh
        run: |
          "PACKAGE_PATH=$(Join-Path $env:RUNNER_TEMP 'workload-package')" >> $env:GITHUB_ENV

      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.event.release.tag_name || github.sha }}

      - name: Download workload package
        uses: actions/download-artifact@v7
        with:
          name: ${{ inputs.artifact-name }}
          path: ${{ env.PACKAGE_PATH }}
          run-id: ${{ inputs.artifact-run-id || github.run_id }}
          github-token: ${{ github.token }}

      - name: Set up Platform Kite
        uses: ./.github/actions/setup-platform-kite
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Sync Workload
        shell: pwsh
        run: |
          $buildInfo = Join-Path $env:PACKAGE_PATH 'build-info.json'
          if (Test-Path -Path $buildInfo) {
            Write-Output "Workload package built by: $(Get-Content -Path $buildInfo -Raw | ConvertFrom-Json | ConvertTo-Json -Compress)"
          }

          if ($env:WHAT_IF -eq 'true') {
            Write-Output "➡️ TODO: Plan (preflight) the deployment of the package in $env:PACKAGE_PATH with WhatIf = true"
          }
          else {
            Write-Output "➡️ TODO: Deploy the package in $env:PACKAGE_PATH with WhatIf = false"
          }
