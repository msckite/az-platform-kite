name: 'Workload CD (prd)'

on:
  push:
    branches:
      - 'main'
    paths:
      - 'src/**'
      - '.github/workflows/workload-*.yml'
  # Manual rerun from main only; other branches are skipped by the job conditions below
  workflow_dispatch:

concurrency:
  # Queue deployments instead of cancelling one that is already applying changes
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Build
    # Builds and tests the package on the main commit once; every deploy job below reuses it
    if: |
      github.ref == 'refs/heads/main'
    uses: ./.github/workflows/workload-validate.yml

  deploy-prd:
    name: Deploy (prd)
    needs: [build]
    uses: ./.github/workflows/workload-provision.yml
    # Never deploy a feature branch, also not through a manual run
    if: |
      github.ref == 'refs/heads/main'
    permissions:
      contents: read
      id-token: write
      actions: read
    with:
      environment: prd-workload
      what-if: false
    secrets: inherit
