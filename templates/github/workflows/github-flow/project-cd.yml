name: 'Project CD (prd)'

on:
  push:
    branches:
      - 'main'
    paths-ignore:
      - 'config/global-config.jsonc'
      - 'config/platform-config.jsonc'
      - '.github/workflows/platform-*.yml'
      - '.github/actions/setup-platform-kite/**'
  # Manual run for a branch if no PR exists
  workflow_dispatch:

concurrency:
  # Ensure only one CD workflow runs per branch at a time
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy-prd:
    name: Deploy (prd)
    uses: ./.github/workflows/project-provision.yml
    if: |
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      id-token: write
    with:
      environment: prd
      what-if: false
    secrets: inherit
