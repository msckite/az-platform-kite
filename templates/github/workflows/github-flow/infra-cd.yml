name: 'Infra CD (prd)'

on:
  push:
    branches:
      - 'main'
    paths:
      - 'iac/**'
      - '.github/workflows/infra-*.yml'
  # Manual run for a branch if no PR exists
  workflow_dispatch:

concurrency:
  # Ensure only one CD workflow runs per branch at a time
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy-prd:
    name: Deploy (prd)
    uses: ./.github/workflows/infra-provision.yml
    if: |
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      id-token: write
    with:
      environment: prd-infra
      what-if: false
    secrets: inherit
