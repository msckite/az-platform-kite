name: 'Workload CI (dev)'

on:
  pull_request:
    branches:
      - main
    paths:
      - 'src/**'
      - '.github/workflows/workload-*.yml'
  # Manual run for a branch before a PR exists
  workflow_dispatch:

concurrency:
  # Ensure only one CI workflow runs per branch at a time
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Validate
    uses: ./.github/workflows/workload-validate.yml

  deploy-dev:
    name: Deploy (dev)
    needs: [validate]
    uses: ./.github/workflows/workload-provision.yml
    if: |
      github.event_name == 'pull_request' ||
      github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      id-token: write
    with:
      environment: dev-workload
      what-if: false
    secrets: inherit

  plan-stg:
    name: Preflight (stg)
    needs: [validate, deploy-dev]
    uses: ./.github/workflows/workload-provision.yml
    permissions:
      contents: read
      id-token: write
    with:
      environment: stg-workload
      what-if: true
    secrets: inherit
