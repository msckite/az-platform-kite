name: 'Infra Release (prd)'

on:
  release:
    types:
      - published
  # Manual (re)deployment of an existing release, e.g. after a failed prd run. Goes through the
  # same staging verification as a published release.
  workflow_dispatch:
    inputs:
      tag:
        description: Existing infra release tag to deploy to prd, e.g. infra/v1.2.0
        type: string
        required: true

concurrency:
  # Queue prd deployments instead of cancelling one that is already applying changes
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify-stg-promotion:
    name: Verify release was promoted through staging
    # Only 'infra/*' tagged releases trigger infra deploys; 'workload/*' releases are ignored here.
    if: |
      (github.event_name == 'release' && github.event.release.target_commitish == 'main' &&
        startsWith(github.event.release.tag_name, 'infra/')) ||
      (github.event_name == 'workflow_dispatch' && startsWith(inputs.tag, 'infra/'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.verify.outputs.tag }}

    steps:
      - name: Check out release commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
          fetch-depth: 0

      - name: Confirm this commit was promoted through staging
        id: verify
        shell: bash
        # Pass the tag through the environment, never inline it into the script (script injection)
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          if ! git fetch origin refs/tags/stg-infra-verified:refs/tags/stg-infra-verified; then
            echo "::error::No 'stg-infra-verified' tag found. Promote a commit through staging before releasing infra to prd."
            exit 1
          fi
          released_sha=$(git rev-parse HEAD)
          verified_sha=$(git rev-list -n 1 stg-infra-verified)
          # An ancestor check (not exact equality) tolerates the tag moving past $released_sha
          # between release creation and this run, since later stg deploys include earlier commits.
          if ! git merge-base --is-ancestor "$released_sha" "$verified_sha"; then
            echo "::error::Release '$RELEASE_TAG' ($released_sha) was not promoted through staging: it is not an ancestor of the last verified commit ($verified_sha). Cut the release from a commit that has been deployed to stg."
            exit 1
          fi
          echo "Release commit ($released_sha) has been verified in staging (stg is at $verified_sha)."
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"

  deploy-prd:
    name: Deploy (prd)
    needs: [verify-stg-promotion]
    # Only ever deploy what the verification job approved; a skipped or failed check blocks prd
    if: |
      needs.verify-stg-promotion.result == 'success'
    uses: ./.github/workflows/infra-provision.yml
    permissions:
      contents: read
      id-token: write
    with:
      environment: prd-infra
      what-if: false
      ref: ${{ needs.verify-stg-promotion.outputs.tag }}
    secrets: inherit
