name: 'Infra Release (prd)'

on:
  release:
    types:
      - published
  # Manual (re)deployment of an existing release, e.g. after a failed prd run. Goes through the
  # same staging verification as a published release.
  workflow_dispatch:
    inputs:
      tag:
        description: Existing infra release tag to deploy to prd, e.g. infra/v1.2.0
        type: string
        required: true

concurrency:
  # Queue prd deployments instead of cancelling one that is already applying changes
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify-stg-promotion:
    name: Verify release content was deployed to staging
    # Only 'infra/*' tagged releases trigger infra deploys; 'workload/*' releases are ignored here.
    if: |
      (github.event_name == 'release' && github.event.release.target_commitish == 'main' &&
        startsWith(github.event.release.tag_name, 'infra/')) ||
      (github.event_name == 'workflow_dispatch' && startsWith(inputs.tag, 'infra/'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      statuses: read
    outputs:
      tag: ${{ steps.verify.outputs.tag }}

    steps:
      - name: Check out release commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
          fetch-depth: 0

      - name: Confirm this content was deployed to staging
        id: verify
        shell: bash
        # Pass the tag through the environment, never inline it into the script (script injection)
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          bash .github/scripts/stg-verification.sh verify iac kite/stg-infra "refs/tags/$RELEASE_TAG"
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"

  deploy-prd:
    name: Deploy (prd)
    needs: [verify-stg-promotion]
    # Only ever deploy what the verification job approved; a skipped or failed check blocks prd
    if: |
      needs.verify-stg-promotion.result == 'success'
    uses: ./.github/workflows/infra-provision.yml
    permissions:
      contents: read
      id-token: write
    with:
      environment: prd-infra
      what-if: false
      ref: ${{ needs.verify-stg-promotion.outputs.tag }}
    secrets: inherit
