name: platform-cd

# Release flow (branchStrategy: "release").
#
# CD runs when a pull request is merged into main (a push to main). It revalidates the
# configuration, applies every provisioning phase to dev, and promotes to stg only after the dev
# stage has completed successfully. Production is deliberately not part of this workflow: prd is
# provisioned by platform-release.yml when a release is published.
#
# Protect the stg GitHub environment with required reviewers if staging should be gated manually.

on:
  push:
    branches:
      - main
    paths:
      - 'config/**'
      - '.github/workflows/platform-*.yml'
      - '.github/actions/setup-platform-kite/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: platform-cd
  cancel-in-progress: false

jobs:
  validate:
    name: Validate
    uses: ./.github/workflows/platform-validate.yml
    permissions:
      contents: read
    with:
      global-config-path: config/global-config.jsonc
      platform-config-path: config/platform-config.jsonc

  deploy-dev:
    name: Deploy (dev)
    needs: validate
    uses: ./.github/workflows/platform-provision.yml
    permissions:
      contents: read
      id-token: write
    with:
      environment: dev
    secrets: inherit

  deploy-stg:
    name: Deploy (stg)
    needs: deploy-dev
    uses: ./.github/workflows/platform-provision.yml
    permissions:
      contents: read
      id-token: write
    with:
      environment: stg
    secrets: inherit
