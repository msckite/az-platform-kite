name: 'Project CD (stg)'

on:
  push:
    branches:
      - 'main'
    paths-ignore:
      - 'config/global-config.jsonc'
      - 'config/platform-config.jsonc'
      - '.github/workflows/platform-*.yml'
      - '.github/actions/setup-platform-kite/**'
  # Manual run for a branch if no PR exists
  workflow_dispatch:

concurrency:
  # Ensure only one CD workflow runs per branch at a time
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy-stg:
    name: Deploy (stg)
    uses: ./.github/workflows/project-provision.yml
    if: |
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      id-token: write
    with:
      environment: stg
      what-if: false
    secrets: inherit

  mark-stg-verified:
    name: Mark commit as verified
    needs: [deploy-stg]
    if: |
      needs.deploy-stg.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      # project-flow-release checks this tag before deploying prd
      - name: Move stg-verified tag to this commit
        run: |
          git tag -f stg-verified
          git push origin stg-verified --force

  plan-prd:
    name: Preflight (prd)
    needs: [mark-stg-verified]
    uses: ./.github/workflows/project-provision.yml
    permissions:
      contents: read
      id-token: write
    with:
      environment: prd
      what-if: true
    secrets: inherit
