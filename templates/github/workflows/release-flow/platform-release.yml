name: platform-release

# Release flow (branchStrategy: "release").
#
# Production is provisioned only when a GitHub release is published. The guard job first confirms
# that the released commit is actually part of main and that the platform-cd workflow succeeded for
# that commit, so prd can never run ahead of dev and stg.
#
# Protect the prd GitHub environment with required reviewers and, if wanted, a deployment branch
# policy limited to protected tags.

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      skip-promotion-check:
        description: Skip the guard that requires a successful platform-cd run for this commit.
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: platform-release
  cancel-in-progress: false

jobs:
  guard:
    name: Verify promotion path
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - name: Check dev and stg were provisioned for this commit
        if: inputs.skip-promotion-check != true
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          $ErrorActionPreference = 'Stop'

          $comparison = gh api "repos/$env:REPOSITORY/compare/main...$env:COMMIT_SHA" | ConvertFrom-Json
          if ($comparison.status -notin @('identical', 'behind')) {
            throw "Commit $env:COMMIT_SHA is not contained in main (status: $($comparison.status)). Release only from main."
          }

          $runs = gh api "repos/$env:REPOSITORY/actions/workflows/platform-cd.yml/runs?head_sha=$env:COMMIT_SHA&status=success" | ConvertFrom-Json
          if ($runs.total_count -lt 1) {
            throw "No successful platform-cd run found for commit $env:COMMIT_SHA. Provision dev and stg before releasing to prd."
          }

  validate:
    name: Validate
    needs: guard
    uses: ./.github/workflows/platform-validate.yml
    permissions:
      contents: read
    with:
      global-config-path: config/global-config.jsonc
      platform-config-path: config/platform-config.jsonc

  deploy-prd:
    name: Deploy (prd)
    needs: validate
    uses: ./.github/workflows/platform-provision.yml
    permissions:
      contents: read
      id-token: write
    with:
      environment: prd
    secrets: inherit
