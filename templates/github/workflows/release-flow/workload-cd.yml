name: 'Workload CD (stg)'

on:
  push:
    branches:
      - 'main'
    paths:
      - 'src/**'
      - '.github/workflows/workload-*.yml'
  # Manual rerun from main only; other branches are skipped by the job conditions below
  workflow_dispatch:

concurrency:
  # Queue deployments instead of cancelling one that is already applying changes
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy-stg:
    name: Deploy (stg)
    uses: ./.github/workflows/workload-provision.yml
    # Never deploy a feature branch, also not through a manual run
    if: |
      github.ref == 'refs/heads/main'
    permissions:
      contents: read
      id-token: write
    with:
      environment: stg-workload
      what-if: false
    secrets: inherit

  mark-stg-verified:
    name: Mark commit as verified
    needs: [deploy-stg]
    if: |
      needs.deploy-stg.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      # workload-flow-release checks this tag before deploying prd
      - name: Move stg-workload-verified tag to this commit
        run: |
          git tag -f stg-workload-verified
          git push origin stg-workload-verified --force

  plan-prd:
    name: Preflight (prd)
    needs: [mark-stg-verified]
    uses: ./.github/workflows/workload-provision.yml
    permissions:
      contents: read
      id-token: write
    with:
      environment: prd-workload
      what-if: true
    secrets: inherit
