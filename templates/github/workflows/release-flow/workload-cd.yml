name: 'Workload CD (stg)'

on:
  push:
    branches:
      - 'main'
    paths:
      - 'src/**'
      # Release bookkeeping written by release-please: changes nothing that gets deployed
      - '!src/CHANGELOG.md'
      - '!src/version.txt'
      - '.github/workflows/workload-*.yml'
  # Manual rerun from main only; other branches are skipped by the job conditions below
  workflow_dispatch:

concurrency:
  # Queue deployments instead of cancelling one that is already applying changes
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy-stg:
    name: Deploy (stg)
    uses: ./.github/workflows/workload-provision.yml
    # Never deploy a feature branch, also not through a manual run
    if: |
      github.ref == 'refs/heads/main'
    permissions:
      contents: read
      id-token: write
    with:
      environment: stg-workload
      what-if: false
    secrets: inherit

  mark-stg-verified:
    name: Record staging deployment
    needs: [deploy-stg]
    if: |
      needs.deploy-stg.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      statuses: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      # workload-flow-release only deploys prd content that carries this status. Kept separate from the
      # infra pipeline's own status, since infra and workload changes promote independently.
      - name: Record 'src' content as deployed to staging
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/stg-verification.sh mark src kite/stg-workload

  plan-prd:
    name: Preflight (prd)
    needs: [mark-stg-verified]
    uses: ./.github/workflows/workload-provision.yml
    permissions:
      contents: read
      id-token: write
    with:
      environment: prd-workload
      what-if: true
    secrets: inherit
